name: liquid_tab_bar
description: Two iOS 26-style floating liquid-glass tab bars for Flutter — a grabbable soap-bubble lens, or a droplet variant with search, actions and badges.
version: 1.2.0
repository: https://github.com/ahmedmarwan47-stack/orderbase_delivery_app/tree/main/packages/liquid_tab_bar
issue_tracker: https://github.com/ahmedmarwan47-stack/orderbase_delivery_app/issues
topics:
  - navigation
  - tabs
  - glassmorphism
  - ios
  - ui

environment:
  sdk: ^3.6.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    # The default bar.
    - assets/shaders/nav_glass.frag
    # The droplet variant's own pair.
    - assets/shaders/droplet/nav_glass.frag
    - assets/shaders/droplet/droplet_glass.frag
